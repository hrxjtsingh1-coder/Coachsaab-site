<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachSaab | Global Tech Insights</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Space+Grotesk:wght@300;600;800&display=swap" rel="stylesheet">

    <style>
        /* --- 1. SETTINGS & VARIABLES --- */
        :root {
            --bg-deep: #050505;
            --bg-panel: #0e0e0e;
            --text-main: #ffffff;
            --text-muted: #888888;
            --gold: #D4AF37;
            --blue: #2563EB;
            --ease-expo: cubic-bezier(0.19, 1, 0.22, 1);
            --ease-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* --- 2. GLOBAL RESET & BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; cursor: none; /* Hide default cursor */ }
        
        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Cinematic Noise Overlay */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Scroll Progress Bar */
        .scroll-progress {
            position: fixed;
            top: 0; left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), #fff);
            width: 0%;
            z-index: 2000;
            transition: width 0.1s;
        }

        /* --- 3. CUSTOM CURSOR --- */
        .cursor-dot, .cursor-circle {
            position: fixed;
            top: 0; left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
        }
        .cursor-dot {
            width: 8px; height: 8px;
            background: white;
        }
        .cursor-circle {
            width: 40px; height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: width 0.2s, height 0.2s, background 0.2s;
        }
        /* Hover State for Cursor */
        body.hovering .cursor-circle {
            width: 60px; height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border-color: transparent;
            backdrop-filter: blur(2px);
        }

        /* --- 4. PRELOADER ANIMATION --- */
        .preloader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.8s var(--ease-expo);
        }
        .loader-text {
            font-family: 'Space Grotesk';
            font-size: 2rem;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.3);
            position: relative;
        }
        .loader-text::before {
            content: 'CoachSaab';
            position: absolute;
            top: 0; left: 0;
            width: 0%;
            height: 100%;
            color: #fff;
            overflow: hidden;
            border-right: 2px solid var(--gold);
            animation: loadText 2s var(--ease-expo) forwards;
        }
        .preloader.hide { transform: translateY(-100%); }

        @keyframes loadText { 
            0% { width: 0; } 
            100% { width: 100%; } 
        }

        /* --- 5. NAVIGATION --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.3s;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, #fff, #999, var(--gold), #fff);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 6s linear infinite;
        }
        @keyframes shine { to { background-position: 300%; } }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 30px;
            font-size: 0.9rem;
            position: relative;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: #fff; }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px; left: 0; width: 0%; height: 1px;
            background: var(--gold);
            transition: width 0.3s var(--ease-expo);
        }
        .nav-links a:hover::after { width: 100%; }

        /* --- 6. HERO SECTION (Parallax & Particles) --- */
        .hero {
            position: relative;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        #particle-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }

        .hero h1 {
            font-family: 'Space Grotesk';
            font-size: clamp(3.5rem, 8vw, 6rem);
            line-height: 1.1;
            mix-blend-mode: screen;
            opacity: 0; /* JS will reveal */
            transform: translateY(30px);
        }
        
        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(30px);
        }

        /* --- 7. SKELETON & CARDS --- */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 80px 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 60px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        /* Skeleton Loading State */
        .skeleton {
            background: #111;
            border-radius: 16px;
            height: 400px;
            position: relative;
            overflow: hidden;
        }
        .skeleton::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: shimmer 1.5s infinite;
        }

        /* Real Card Styles */
        .card-3d {
            background: var(--bg-panel);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
            position: relative;
            transform-style: preserve-3d;
            opacity: 0; /* For scroll reveal */
            transform: translateY(50px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        
        .card-3d.visible { opacity: 1; transform: translateY(0); }

        .card-img-box {
            height: 220px;
            overflow: hidden;
        }
        .card-img-box img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.7s var(--ease-expo);
        }
        .card-3d:hover .card-img-box img { transform: scale(1.1); }

        .card-content { padding: 30px; }
        
        .tag {
            color: var(--gold);
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            display: block;
            margin-bottom: 15px;
        }

        .card-3d h3 {
            font-family: 'Space Grotesk';
            font-size: 1.5rem;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        
        .card-3d p { color: var(--text-muted); font-size: 0.95rem; }

        /* --- 8. SIDEBAR & PROFILE --- */
        aside { position: sticky; top: 120px; height: fit-content; }

        .profile-widget {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            opacity: 0; /* Scroll reveal */
        }

        .avatar-wrap {
            width: 120px; height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(180deg, var(--gold), transparent);
            position: relative;
        }
        
        .avatar-img {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 4px solid var(--bg-deep);
            object-fit: cover;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .icon {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .icon:hover { background: #fff; color: #000; transform: translateY(-3px); }

        /* --- 9. AD SLOTS --- */
        .ad-slot {
            width: 100%;
            background: repeating-linear-gradient(45deg, #0a0a0a, #0a0a0a 10px, #111 10px, #111 20px);
            border: 1px dashed #333;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: #444;
            font-size: 0.8rem;
        }

        /* --- 10. FOOTER --- */
        footer {
            border-top: 1px solid rgba(255,255,255,0.05);
            text-align: center;
            padding: 80px 0;
            margin-top: 100px;
            color: var(--text-muted);
            opacity: 0;
        }

        /* Mobile */
        @media(max-width: 900px) {
            .container { grid-template-columns: 1fr; }
            .nav-links { display: none; }
            .cursor-circle, .cursor-dot { display: none; } /* No custom cursor on mobile */
            * { cursor: auto; }
        }
    </style>
</head>
<body>

    <script>
        // --- 1. DATA: REAL CONTENT MOCKUP ---
        const realPosts = [
            { title: "GPT-5 Architecture", cat: "Analysis", img: "https://images.unsplash.com/photo-1620712943543-bcc4688e7485?w=600&auto=format&fit=crop", text: "Deep dive into the leaked specs and what it means." },
            { title: "DeFi vs TradFi", cat: "Markets", img: "https://images.unsplash.com/photo-1639762681485-074b7f938ba0?w=600&auto=format&fit=crop", text: "Institutional capital is moving to decentralized protocols." },
            { title: "Rust in Production", cat: "DevOps", img: "https://images.unsplash.com/photo-1555099962-4199c345e5dd?w=600&auto=format&fit=crop", text: "Why we rewrote our entire backend in Rust." },
            { title: "Zero Trust Security", cat: "Cyber", img: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=600&auto=format&fit=crop", text: "The definitive guide to enterprise security." }
        ];

        // --- 2. LOADER & SKELETON REPLACEMENT ---
        window.addEventListener('load', () => {
            // Remove Preloader
            setTimeout(() => {
                document.querySelector('.preloader').classList.add('hide');
                
                // Trigger Hero Animation
                const heroTexts = document.querySelectorAll('.reveal-text');
                heroTexts.forEach((el, index) => {
                    setTimeout(() => {
                        el.style.opacity = '1';
                        el.style.transform = 'translateY(0)';
                        el.style.transition = 'all 1s cubic-bezier(0.19, 1, 0.22, 1)';
                    }, 500 + (index * 200));
                });

                // Simulate Data Load (Replace Skeletons)
                setTimeout(loadRealContent, 800);

            }, 2000); // 2 second fake load time
        });

        function loadRealContent() {
            const container = document.getElementById('cardContainer');
            container.innerHTML = ''; // Clear skeletons
            
            realPosts.forEach((post, i) => {
                const article = document.createElement('article');
                article.className = 'card-3d hover-trigger';
                article.innerHTML = `
                    <div class="card-img-box"><img src="${post.img}" alt="${post.title}"></div>
                    <div class="card-content">
                        <span class="tag">${post.cat}</span>
                        <h3>${post.title}</h3>
                        <p>${post.text}</p>
                    </div>
                `;
                container.appendChild(article);
                
                // Staggered Reveal
                setTimeout(() => article.classList.add('visible'), i * 150);
                
                // Re-init Tilt for new elements
                initTilt(article);
            });
        }

        // --- 3. SCROLL PROGRESS & OBSERVER ---
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById("progressBar").style.width = scrolled + "%";

            // Parallax Hero Text
            const heroContent = document.querySelector('.hero-content');
            heroContent.style.transform = `translateY(${winScroll * 0.4}px)`;
        });

        // Intersection Observer for Fade-ins
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                    entry.target.style.transition = 'all 0.8s ease-out';
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));

        // --- 4. CUSTOM CURSOR LOGIC ---
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorCircle = document.querySelector('.cursor-circle');

        window.addEventListener('mousemove', (e) => {
            const posX = e.clientX;
            const posY = e.clientY;

            // Dot moves instantly
            cursorDot.style.left = `${posX}px`;
            cursorDot.style.top = `${posY}px`;

            // Circle moves with delay (lag effect)
            cursorCircle.animate({
                left: `${posX}px`,
                top: `${posY}px`
            }, { duration: 500, fill: "forwards" });

            // Hover States
            const target = e.target;
            if (target.classList.contains('hover-trigger') || target.tagName === 'A') {
                document.body.classList.add('hovering');
            } else {
                document.body.classList.remove('hovering');
            }
        });

        // --- 5. 3D TILT ENGINE ---
        function initTilt(card) {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / 20) * -1;
                const rotateY = (x - centerX) / 20;

                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
            });
        }

        // --- 6. PARTICLE SYSTEM (CANVAS) ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = w
